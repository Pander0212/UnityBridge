name: UnityBridgeProbe
options:
  bundleIdPrefix: io.github.pander0212
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
targets:
  UnityBridgeProbe:
    type: application
    platform: iOS
    sources:
      - Sources
      # Husk's Android runtime (scripts/fetch-husk.sh, GPL-2.0-or-later), compiled in unmodified, as
      # Husk's own app does it. Not in the repository: fetched at build time.
      - path: ../build/husk/src/translation-layer
      - path: ../build/husk/src/translation-layer-next
        excludes:
          - "husk-tl-unity-app.h"
      - path: ../third_party/madeira/madeira-jit.js
        buildPhase: resources
      - path: Generated/ubtest.dll
        buildPhase: resources
    configFiles:
      Release: Generated/Libraries.xcconfig
      Debug: Generated/Libraries.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.pander0212.unitybridge.probe
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: UnityBridgeProbe.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/UnityBridgeProbe-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: NO
        # Husk's sources: ObjC with ARC, C as gnu11 (Husk's own project settings).
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../build/husk/src/translation-layer-next"
          - "$(SRCROOT)/../build/husk/src/translation-layer"
        # What Husk's runtime links against (its project.yml), all part of the iOS SDK.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lz"
          - "-lresolv"
          - "-lsqlite3"
          - "-framework AudioToolbox"
          - "-framework CoreText"
          - "-framework CoreGraphics"
          - "-framework ImageIO"
          - "-framework WebKit"
          - "-framework VideoToolbox"
          - "-framework CoreMedia"
          - "-framework CoreVideo"
          - "-framework Accelerate"
          - "-framework Security"
          - "-framework Metal"
          - "-framework QuartzCore"
          - "-framework CoreMotion"
