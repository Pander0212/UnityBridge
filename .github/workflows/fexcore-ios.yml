name: FEXCore for iOS
# M2a: builds FEXCore (x86-64 -> ARM64 JIT) as arm64 iOS static libraries from AetherPS4's
# Darwin port (scripts/build-fexcore-ios.sh). Contains no game code.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fexcore-ios.yml
      - scripts/build-fexcore-ios.sh
permissions:
  contents: read
concurrency:
  group: fexcore-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reuse compiled objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: fexcore-ios-v1-${{ github.run_id }}
          restore-keys: fexcore-ios-v1-
      - name: Build tools
        run: brew install -q ccache cmake ninja
      - name: Build FEXCore
        run: |
          set -o pipefail
          bash scripts/build-fexcore-ios.sh 2>&1 | tee build-fexcore-ios.log
      - name: Package
        run: |
          (cd build/fexcore-ios && zip -qry ../../fexcore-ios.zip out)
          ls -la fexcore-ios.zip
      - name: Keep the libraries
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fexcore-ios
          path: fexcore-ios.zip
          retention-days: 14
      - name: Keep compiled objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: fexcore-ios-v1-${{ github.run_id }}
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fexcore-ios-log
          path: build-fexcore-ios.log
          retention-days: 14
